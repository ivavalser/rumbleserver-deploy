# Operator compose: готовый образ из GHCR, без исходников на диске.
# Версия: VERSION=stable (по умолчанию) или VERSION=1.0.0
#
# FEATURE_* по умолчанию в образе (Dockerfile); блок ниже — optional override через .env при парсинге compose.

x-rmbl-app-features: &rmbl_app_features
  FEATURE_DEVICE_KEY_SYNC_SIGNALING: ${FEATURE_DEVICE_KEY_SYNC_SIGNALING:-true}
  FEATURE_PRIMARY_DEVICE: ${FEATURE_PRIMARY_DEVICE:-true}
  FEATURE_TURN_CREDENTIALS: ${FEATURE_TURN_CREDENTIALS:-true}
  FEATURE_ATOMIC_SENDER_MESSAGE_INDEX: ${FEATURE_ATOMIC_SENDER_MESSAGE_INDEX:-true}

services:
  db:
    profiles: ["local-db"]
    image: postgres:15-alpine
    container_name: rumbleserver_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-rumbleserver_db}
      POSTGRES_USER: ${DB_USER:-rumbleserver_user}
      POSTGRES_PASSWORD: ${DB_PASS:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rumbleserver_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rumbleserver_network
    restart: unless-stopped

  redis:
    profiles: ["local-redis"]
    image: redis:7-alpine
    container_name: rumbleserver_redis
    env_file:
      - .env
    command: sh -c "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rumbleserver_network
    restart: unless-stopped

  web:
    image: ghcr.io/ivavalser/rumbleserver:${VERSION:-stable}
    container_name: rumbleserver_web
    command: daphne -b 0.0.0.0 -p 8000 --access-log /dev/null rumbleserver.asgi:application
    volumes:
      - static_volume:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_VERSION: ${VERSION:-stable}
      <<: *rmbl_app_features
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rumbleserver_network
    restart: unless-stopped

  worker:
    image: ghcr.io/ivavalser/rumbleserver:${VERSION:-stable}
    container_name: rumbleserver_worker
    command: python messaging/redis_worker.py
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      <<: *rmbl_app_features
    depends_on:
      - db
      - redis
      - web
    networks:
      - rumbleserver_network
    restart: unless-stopped

  push_worker:
    image: ghcr.io/ivavalser/rumbleserver:${VERSION:-stable}
    container_name: rumbleserver_push_worker
    command: python notifications/push_worker.py
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis
      - web
    networks:
      - rumbleserver_network
    restart: unless-stopped

  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6.3
    container_name: rumbleserver_coturn
    network_mode: host
    entrypoint: ["/bin/sh", "/coturn/entrypoint.sh"]
    environment:
      COTURN_AUTH_SECRET: ${COTURN_AUTH_SECRET:-}
      TURN_REALM: ${TURN_REALM:-}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_PRIVATE_IP: ${TURN_PRIVATE_IP:-}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
    volumes:
      - ./coturn/entrypoint.sh:/coturn/entrypoint.sh:ro
      - ./coturn/certs:/certs:ro
    restart: unless-stopped

volumes:
  postgres_data:
    name: rumbleserver_postgres_data
  redis_data:
    name: rumbleserver_redis_data
  static_volume:
    name: rumbleserver_static_volume

networks:
  rumbleserver_network:
    name: rumbleserver_network
    driver: bridge
